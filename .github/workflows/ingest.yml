name: Ingest ticket emails

on:
  schedule:
    # Every 6 hours.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          before=$(sqlite3 transactions.db "SELECT COUNT(*) FROM transactions;" 2>/dev/null || echo 0)
          skipped_before=$(sqlite3 transactions.db "SELECT COUNT(*) FROM skipped_emails;" 2>/dev/null || echo 0)
          python ingest.py
          after=$(sqlite3 transactions.db "SELECT COUNT(*) FROM transactions;" 2>/dev/null || echo 0)
          skipped_after=$(sqlite3 transactions.db "SELECT COUNT(*) FROM skipped_emails;" 2>/dev/null || echo 0)
          echo "NEW_COUNT=$((after - before))" >> "$GITHUB_ENV"
          echo "NEW_SKIPPED=$((skipped_after - skipped_before))" >> "$GITHUB_ENV"

      - name: Run matching
        run: |
          python match.py
          match_count=$(sqlite3 transactions.db "SELECT COUNT(*) FROM matches;" 2>/dev/null || echo 0)
          echo "MATCH_COUNT=$match_count" >> "$GITHUB_ENV"

      - name: Run export
        run: python export.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # match.py fully rebuilds the `matches` table and export.py always
          # rewrites EmailScrape.xlsx (openpyxl bumps internal modified-time
          # metadata on every save), so both files show up as byte-changed
          # on every run even when no new transactions came in. Gating on
          # NEW_COUNT (real new rows from ingest.py) instead of a raw file
          # diff avoids committing on every scheduled run with nothing new.
          # NEW_SKIPPED counts too: newly recorded skips must be committed or
          # the next run sends those emails to Gemini again.
          if [ "${NEW_COUNT:-0}" -le 0 ] && [ "${NEW_SKIPPED:-0}" -le 0 ]; then
            echo "No new transactions or skips this run; skipping commit."
            exit 0
          fi

          git add -f transactions.db
          git add EmailScrape.xlsx
          if git diff --cached --quiet; then
            echo "New transactions were found but tracked files are unchanged; skipping commit."
          else
            git commit -m "chore: pipeline run $(date -u +%Y-%m-%d) (${NEW_COUNT} new transactions, ${NEW_SKIPPED:-0} skipped, ${MATCH_COUNT:-0} matched pairs)"
            git push
          fi
